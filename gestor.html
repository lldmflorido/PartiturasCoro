<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administracion</title>
    <link rel="stylesheet" href="css/gestor.css">
    
    <script src="js/es6-shim.min.js"></script>
    <script>
        window.onerror = function(msg, url, line) {
            alert("ERROR GESTOR:\n" + msg + "\nLínea: " + line);
            return false;
        };
    </script>
</head>
<body>
    <header class="cabecera-gestor">
        <div class="logo-gestor"><h2>Gestor</h2></div>
        <div class="controles-cabecera oculto" id="controles-cabecera">
            <span id="contador-cambios" class="badge-cambios">0 Cambios</span>
            <button id="btn-sincronizar" class="btn-sincronizar" disabled>Sincronizar</button>
            <button id="btn-cerrar-sesion" class="btn-secundario">Salir</button>
        </div>
    </header>

    <main class="contenedor-principal">
        <section id="seccion-login" class="panel contenedor-centrado">
            <h3>Acceso</h3>
            <input type="password" id="input-token" placeholder="Llave (Token)" style="width:100%; padding:10px; margin:10px 0;">
            <button id="btn-acceder" class="btn-primario">Entrar</button>
            <div id="mensaje-login"></div>
        </section>

        <section id="seccion-trabajo" class="oculto">
            <div class="barra-herramientas">
                <input type="text" id="buscador-gestor" placeholder="Filtrar...">
                <button id="btn-nuevo-canto" class="btn-primario">+ Nuevo</button>
            </div>
            <div class="panel" style="overflow:auto;">
                <table class="tabla-datos">
                    <thead><tr><th>Canto</th><th>Acciones</th></tr></thead>
                    <tbody id="cuerpo-tabla-cantos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modales simplificados para iPad -->
    <div id="modal-formulario" class="modal-overlay oculto" style="background:rgba(0,0,0,0.8); z-index:1000;">
        <div class="modal-contenido" style="background:white; padding:20px; margin:20px; border-radius:10px;">
            <h3 id="titulo-modal">Canto</h3>
            <input type="hidden" id="indice-canto">
            <label>Título:</label><br>
            <input type="text" id="nombre-canto" style="width:100%; padding:8px;"><br><br>
            <label>Temas (Comas):</label><br>
            <input type="text" id="temas-canto" style="width:100%; padding:8px;"><br><br>
            <label>PDF:</label><br>
            <input type="file" id="archivo-pdf" accept=".pdf"><br><br>
            <button id="btn-guardar-local" class="btn-primario">Guardar</button>
            <button id="btn-cerrar-formulario" class="btn-secundario">Cancelar</button>
        </div>
    </div>

    <div id="modal-carga" class="modal-overlay oculto">
        <div class="modal-contenido centrado">
            <h3>Procesando...</h3>
            <p id="texto-carga">Subiendo datos...</p>
        </div>
    </div>

    <script src="js/gestor.js"></script>
</body>
</html>
