<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administracion</title>
    <link rel="stylesheet" href="css/gestor.css">
    
    <script src="js/es6-shim.min.js"></script>
    <script>
        window.onerror = function(msg, url, line) {
            alert("ERROR GESTOR:\n" + msg + "\nLínea: " + line);
            return false;
        };
    </script>
</head>
<body>
    <header class="cabecera-gestor">
        <div class="logo-gestor"><h2>Gestor Local Directo</h2></div>
        <div class="controles-cabecera" id="controles-cabecera">
            <button id="btn-vincular-carpeta" class="btn-sincronizar">Vincular Carpeta Proyecto</button>
            <span id="estado-carpeta" style="font-size: 12px; color: #666;">Carpeta no vinculada</span>
            <a href="index.html" class="btn-secundario" style="text-decoration: none;">Ver Repertorio</a>
        </div>
    </header>

    <main class="contenedor-principal">
        <section id="seccion-trabajo">
            <div class="barra-herramientas">
                <input type="text" id="buscador-gestor" placeholder="Filtrar cantos...">
                <button id="btn-nuevo-canto" class="btn-primario" disabled>+ Nuevo Canto</button>
            </div>
            <div class="panel">
                <table class="tabla-datos">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Temas</th>
                            <th>Fecha</th>
                            <th>Archivo PDF</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla-cantos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal Formulario -->
    <div id="modal-formulario" class="modal-overlay oculto">
        <div class="modal-contenido">
            <div class="modal-cabecera">
                <h3 id="titulo-modal">Canto</h3>
                <button id="btn-cerrar-formulario" class="btn-cerrar-modal">&times;</button>
            </div>
            <div class="modal-cuerpo">
                <input type="hidden" id="indice-canto">
                
                <div class="grupo-formulario">
                    <label>Título del Canto:</label>
                    <input type="text" id="nombre-canto" placeholder="Ej: Alabad a Jehová">
                </div>

                <div class="grupo-formulario">
                    <label>Temas (separados por comas):</label>
                    <input type="text" id="temas-canto" placeholder="Ej: Alabanza, Adoración">
                </div>

                <div class="grupo-formulario">
                    <label>Archivo PDF:</label>
                    <div id="contenedor-archivo-actual" class="oculto" style="margin-bottom: 10px; font-size: 13px;">
                        Archivo actual: <span id="nombre-archivo-actual" style="font-weight: bold;"></span>
                    </div>
                    <input type="file" id="input-archivo-pdf" accept=".pdf">
                    <p class="texto-ayuda">Si seleccionas un archivo, se copiará automáticamente a la carpeta /Partituras</p>
                </div>
            </div>
            <div class="modal-pie">
                <button id="btn-cancelar-formulario" class="btn-secundario">Cancelar</button>
                <button id="btn-guardar-directo" class="btn-primario">Guardar y Aplicar</button>
            </div>
        </div>
    </div>

    <!-- Modal Confirmación -->
    <div id="modal-confirmacion" class="modal-overlay oculto">
        <div class="modal-contenido modal-pequeno">
            <div class="modal-cuerpo centrado">
                <h3 id="texto-confirmacion">¿Estás seguro?</h3>
            </div>
            <div class="modal-pie" style="justify-content: center;">
                <button id="btn-cancelar-confirmacion" class="btn-secundario">No, volver</button>
                <button id="btn-aceptar-confirmacion" class="btn-peligro">Sí, confirmar</button>
            </div>
        </div>
    </div>

    <script src="js/gestor.js"></script>
</body>
</html>
