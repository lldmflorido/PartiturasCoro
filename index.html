<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Repertorio</title>
    
    <!-- Meta tags para "Instalar" como App en iPad (Pantalla completa sin Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Repertorio">
    <link rel="apple-touch-icon" href="icono.png">

    <link rel="stylesheet" href="css/estilos.css">
    
    <script src="js/es6-shim.min.js"></script>
    <script>
        window.onerror = function(msg, url, line) {
            alert("ERROR CRÍTICO:\n" + msg + "\nEn: " + url + "\nLínea: " + line);
            return false;
        };
    </script>
</head>
<body>
    <div id="overlay-sidebar"></div>

    <div id="vista-menu" class="layout-principal">
        <aside id="sidebar-temas">
            <button id="btn-cerrar-sidebar">CERRAR</button>
            <div class="logo-sidebar">
    		    <h2>Repertorio</h2>
                <span id="contador-cantos" class="contador-estilo">0</span>
	        </div>
            <ul id="lista-temas"></ul>
        </aside>

        <main class="contenido-derecho">
            <header class="cabecera-menu">
                <button id="btn-toggle-sidebar">TEMAS</button>
                <input type="text" id="buscador" placeholder="Buscar canto...">
            </header>
            <div id="lista-cantos" class="lista-vertical">
                <p style="padding:20px; text-align:center;">Buscando cantos en la base de datos...</p>
            </div>
        </main>
    </div>

    <div id="vista-visor" style="display: none;">
        <div id="barra-superior">
            <button id="btn-cerrar">VOLVER</button>
            <h2 id="titulo-canto"></h2>
        </div>
        <div id="contenedor-pdf"></div>
    </div>

    <!-- Carga de librerías locales únicamente -->
    <script src="js/pdf.min.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // Registro de Service Worker (Solo para dispositivos modernos)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').then(function(reg) {
                    console.log('Service Worker registrado con éxito');
                }).catch(function(err) {
                    console.log('Fallo al registrar Service Worker:', err);
                });
            });
        }
    </script>
</body>
</html>
