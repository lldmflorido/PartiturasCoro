<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Repertorio</title>
    
    <!-- Meta tags para "Instalar" como App en iPad (Pantalla completa sin Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Repertorio">
    <link rel="apple-touch-icon" href="icono.png">

    <link rel="stylesheet" href="css/estilos.css">
    
    <script src="js/es6-shim.min.js"></script>
    <script>
        window.onerror = function(msg, url, line) {
            alert("ERROR CRÍTICO:\n" + msg + "\nEn: " + url + "\nLínea: " + line);
            return false;
        };
    </script>
</head>
<body>
    <div id="debug-log" style="position:fixed; bottom:0; width:100%; background:rgba(0,0,0,0.7); color:white; font-size:10px; z-index:9999; height:50px; overflow:auto; pointer-events:none;">
        Cargando sistema...
    </div>

    <div id="vista-menu" class="layout-principal">
        <aside id="sidebar-temas">
            <div class="logo-sidebar">
    		    <h2>Repertorio</h2>
                <span id="contador-cantos" class="contador-estilo">0</span>
	        </div>
            <ul id="lista-temas"></ul>
        </aside>

        <main class="contenido-derecho">
            <header class="cabecera-menu">
                <button id="btn-toggle-sidebar" style="padding:10px; background:#D4AF37; color:white; border:none; border-radius:5px;">TEMAS</button>
                <input type="text" id="buscador" placeholder="Buscar canto..." style="margin-left:10px; flex-grow:1; padding:10px; border:1px solid #ccc; border-radius:5px;">
            </header>
            <div id="lista-cantos" class="lista-vertical">
                <p style="padding:20px; text-align:center;">Buscando cantos en la base de datos...</p>
            </div>
        </main>
    </div>

    <div id="vista-visor" style="display: none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:10000;">
        <div id="barra-superior" style="height:60px; background:#f4f4f4; display:flex; align-items:center; padding:0 15px; border-bottom:1px solid #ccc;">
            <button id="btn-cerrar" style="padding:10px; background:#666; color:white; border:none; border-radius:5px;">VOLVER</button>
            <h2 id="titulo-canto" style="margin-left:15px; font-size:16px; flex-grow:1; overflow:hidden; white-space:nowrap;"></h2>
        </div>
        <div id="contenedor-pdf" style="height:calc(100% - 60px); overflow:auto; -webkit-overflow-scrolling:touch; background:#eee;"></div>
    </div>

    <!-- Carga de librerías locales únicamente -->
    <script src="js/pdf.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
